<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blueprint">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Transformation Blueprint</title>
<style>
/* Layout: iOS-style app. Opaque content cards scroll under a floating glass nav layer (top bar, tab bar, sheet).
   Phases keep the bumper-plate colours: 10 green, 15 yellow, 20 blue, 25 red, 5 white. */
:root{
  --bg:#f2f4f7; --card:#ffffff; --card2:#f4f6f9; --ink:#0f1418; --muted:#6a737d; --sep:rgba(60,64,72,.14);
  --accent:#2453a6; --on-accent:#ffffff;
  --p-green:#2c8549; --p-yellow:#c99700; --p-blue:#2453a6; --p-red:#c23a2a; --p-white:#8e99a3;
  --good:#2c8549; --warn:#b07400; --bad:#c23a2a;
  --glass-rgb:250,251,253; --glass-a:.42;
  --glass-hl:rgba(255,255,255,.95); --glass-hl2:rgba(255,255,255,.5); --glass-edge:rgba(20,26,34,.12);
  --glass-spec:rgba(255,255,255,.75); --glass-shadow:rgba(16,24,40,.14); --glass-bright:1.06;
  --lens:rgba(20,30,48,.07); --seg-sel:#ffffff;
  --amb1:rgba(36,83,166,.22); --amb2:rgba(44,133,73,.16); --amb3:rgba(194,58,42,.14); --amb4:rgba(201,151,0,.14);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07090b; --card:#15181c; --card2:#1d2126; --ink:#eef2f5; --muted:#949ea8; --sep:rgba(235,240,245,.12);
  --accent:#7aa2f2; --on-accent:#07090b;
  --p-green:#55b878; --p-yellow:#e6bb3a; --p-blue:#7aa2f2; --p-red:#ec6f5f; --p-white:#b8c2ca;
  --good:#55b878; --warn:#e6bb3a; --bad:#ec6f5f;
  --glass-rgb:34,38,44; --glass-hl:rgba(255,255,255,.34); --glass-hl2:rgba(255,255,255,.1); --glass-edge:rgba(0,0,0,.55);
  --glass-spec:rgba(255,255,255,.22); --glass-shadow:rgba(0,0,0,.5); --glass-bright:1.1;
  --lens:rgba(255,255,255,.12); --seg-sel:rgba(255,255,255,.18);
  --amb1:rgba(122,162,242,.22); --amb2:rgba(85,184,120,.12); --amb3:rgba(236,111,95,.12); --amb4:rgba(230,187,58,.1);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07090b; --card:#15181c; --card2:#1d2126; --ink:#eef2f5; --muted:#949ea8; --sep:rgba(235,240,245,.12);
  --accent:#7aa2f2; --on-accent:#07090b;
  --p-green:#55b878; --p-yellow:#e6bb3a; --p-blue:#7aa2f2; --p-red:#ec6f5f; --p-white:#b8c2ca;
  --good:#55b878; --warn:#e6bb3a; --bad:#ec6f5f;
  --glass-rgb:34,38,44; --glass-hl:rgba(255,255,255,.34); --glass-hl2:rgba(255,255,255,.1); --glass-edge:rgba(0,0,0,.55);
  --glass-spec:rgba(255,255,255,.22); --glass-shadow:rgba(0,0,0,.5); --glass-bright:1.1;
  --lens:rgba(255,255,255,.12); --seg-sel:rgba(255,255,255,.18);
  --amb1:rgba(122,162,242,.22); --amb2:rgba(85,184,120,.12); --amb3:rgba(236,111,95,.12); --amb4:rgba(230,187,58,.1);
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.42 var(--sans);letter-spacing:-.01em;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
p{margin:0}

/* ambient colour field so the glass has something to refract */
.ambient{position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
   radial-gradient(38% 28% at 18% 12%,var(--amb1),transparent 70%),
   radial-gradient(36% 30% at 88% 30%,var(--amb3),transparent 70%),
   radial-gradient(40% 30% at 12% 78%,var(--amb2),transparent 70%),
   radial-gradient(34% 26% at 85% 92%,var(--amb4),transparent 70%)}

/* ---------- Liquid-glass material ---------- */
.glass{
  position:relative;isolation:isolate;
  background:rgba(var(--glass-rgb),var(--glass-a));
  -webkit-backdrop-filter:blur(16px) saturate(190%) brightness(var(--glass-bright));
  backdrop-filter:blur(16px) saturate(190%) brightness(var(--glass-bright));
  border:.5px solid var(--glass-edge);
  box-shadow:
    inset 0 1px .5px var(--glass-hl),
    inset 0 -.5px .5px var(--glass-hl2),
    inset 0 0 18px rgba(255,255,255,.06),
    0 12px 32px -8px var(--glass-shadow),
    0 2px 6px -2px var(--glass-shadow);
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:
    linear-gradient(140deg,var(--glass-spec) 0%,transparent 30%),
    linear-gradient(320deg,var(--glass-spec) 0%,transparent 22%);
  opacity:.55}

/* ---------- top bar ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);pointer-events:none}
.bar-bg{position:absolute;inset:0;opacity:0;transition:opacity .25s;border:0;border-bottom:.5px solid var(--glass-edge);border-radius:0;box-shadow:none}
.bar.scrolled .bar-bg{opacity:1}
.bar-inner{position:relative;height:50px;display:flex;align-items:center;justify-content:center;max-width:680px;margin:0 auto;padding-inline:16px}
.bar-title{font-weight:600;font-size:17px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.bar.titled .bar-title{opacity:1;transform:none}
.round-btn{pointer-events:auto;position:absolute;right:16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent);padding:0}
.round-btn svg{width:22px;height:22px}

/* ---------- content ---------- */
main{max-width:680px;margin:0 auto;padding-inline:16px;
  padding-top:calc(env(safe-area-inset-top,0px) + 52px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
.view{display:none}
.view.on{display:block;animation:viewin .32s ease both}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1.lt{font:700 34px/1.1 var(--sans);letter-spacing:.01em;margin:6px 0 4px}
.sub{color:var(--muted);font-size:15px;margin-bottom:18px}
h2.sh{font:600 13px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 4px 8px}
h3{font:600 20px/1.2 var(--sans);margin:0}
.stack{display:grid;gap:12px}
.card{background:var(--card);border-radius:22px;padding:16px;min-width:0}
.card+.card{margin-top:12px}
.list{background:var(--card);border-radius:22px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;min-height:48px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .l{min-width:0;flex:1}
.row .r{color:var(--muted);text-align:right;flex:none;font-size:15px}
.row small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:18px;padding:12px;display:grid;gap:2px;min-width:0}
.tile b{font:600 22px/1.15 var(--round);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:600;font-size:16px;background:var(--accent);color:var(--on-accent)}
.btn.glass{background:rgba(var(--glass-rgb),var(--glass-a));color:var(--accent)}
.btn.block{width:100%}
.btn.plain{background:transparent;color:var(--accent);padding:8px 0}
.btn.danger{background:transparent;color:var(--bad);padding:8px 0}
.pill{display:inline-block;font:600 12px var(--sans);padding:3px 9px;border-radius:999px;background:var(--card2);white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.chip{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.meter{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:4px}
ul.rules{margin:0;padding:0 0 0 18px;display:grid;gap:8px;font-size:15.5px}
.note{font-size:14px;color:var(--muted)}
.hscroll{overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}

/* segmented control */
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;margin-bottom:14px;max-width:100%}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-size:15px;font-weight:500;white-space:nowrap;transition:background .25s}
.seg button[aria-selected="true"]{background:var(--seg-sel);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* flags */
.flag{display:grid;grid-template-columns:4px 1fr;gap:12px;font-size:15px}
.flag::before{content:"";border-radius:2px;background:var(--warn)}
.flag.good::before{background:var(--good)}.flag.bad::before{background:var(--bad)}

/* form rows */
.row input,.row select{border:0;background:transparent;text-align:right;font-size:17px;color:var(--accent);min-width:0;width:9.5em;padding:4px 0;font-family:var(--round)}
.row select{width:auto;max-width:60%;direction:rtl;-webkit-appearance:none;appearance:none}
.row input:focus,.row select:focus{outline:none}
input[type=range]{width:100%;accent-color:var(--accent)}

/* timeline */
.weeks{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.wk{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font:600 11px var(--round);color:#fff;max-width:100%}
.wk.after{background:var(--card2);color:var(--muted)}
.wk.deload{background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,255,255,.4) 4px 6px)}
.wk.now{outline:2.5px solid var(--ink);outline-offset:1.5px}
details.phase{background:var(--card);border-radius:20px;padding:14px 16px}
details.phase+details.phase{margin-top:10px}
details.phase summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer}
details.phase summary::-webkit-details-marker{display:none}
details.phase summary .bar5{width:6px;align-self:stretch;border-radius:3px}
details.phase dl{margin:12px 0 0 18px;display:grid;gap:8px;font-size:15px}
details.phase dt{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
details.phase dd{margin:0 0 4px}

/* today ring */
.hero{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.ring .trk{stroke:var(--card2)}
.ring text{fill:var(--ink);font-family:var(--round)}

/* meals */
.meal{padding:12px 0;border-top:.5px solid var(--sep)}
.meal:first-child{border-top:0;padding-top:0}
.meal-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meal-h b{font-weight:600}
.slot{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.items{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:15px}
.items li{display:flex;justify-content:space-between;gap:10px}
.items li span:last-child{font-family:var(--round);color:var(--muted);flex:none}

/* home-week table */
.tw{overflow-x:auto;border-radius:22px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:.5px solid var(--sep);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
th.cur,td.cur{background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* chart */
svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--sep)}
.chart .ax{fill:var(--muted);font:10px var(--round)}
.chart .target{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .goal{stroke:var(--p-green);stroke-dasharray:2 3}
.chart .avg{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round}
.chart .dot{fill:var(--accent);opacity:.3}
.chart .avgdot{fill:var(--accent)}
.chart .empty{fill:var(--muted);font:13px var(--sans)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);
  width:min(calc(100% - 24px),460px);bottom:max(10px,calc(env(safe-area-inset-bottom,0px) - 6px));
  height:64px;border-radius:32px;display:grid;grid-template-columns:repeat(5,1fr);padding:4px}
.lens{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/5);border-radius:28px;background:var(--lens);
  box-shadow:inset 0 1px .5px var(--glass-hl2),inset 0 0 0 .5px var(--glass-edge);
  transition:transform .5s cubic-bezier(.3,1.35,.45,1)}
.tab{position:relative;border:0;background:transparent;display:grid;justify-items:center;align-content:center;gap:2px;color:var(--ink);padding:0;border-radius:28px}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:0}
.tab[aria-selected="true"]{color:var(--accent)}
.tab:active svg{transform:scale(.9)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28)}
.sheet{position:fixed;z-index:41;left:8px;right:8px;max-width:520px;margin:0 auto;
  bottom:max(8px,env(safe-area-inset-bottom,0px));border-radius:34px;padding:10px 18px 18px;
  --glass-a:.72;animation:sheetup .38s cubic-bezier(.2,1.1,.4,1) both}
@keyframes sheetup{from{transform:translateY(110%)}to{transform:none}}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--muted);opacity:.4;margin:0 auto 10px}
.sheet .fields{display:grid;gap:10px;margin:14px 0}
.sheet label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.sheet input{border:0;border-radius:14px;padding:12px 14px;font-size:17px;background:rgba(var(--glass-rgb),.65);box-shadow:inset 0 0 0 .5px var(--glass-edge);width:100%;font-family:var(--round)}
.sheet .acts{display:grid;grid-template-columns:1fr 2fr;gap:10px}

.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600;animation:viewin .3s ease both}

/* stays */
.row.stay{display:grid;gap:8px;justify-content:stretch}
.stay-top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row.stay select{direction:ltr;text-align:left;font-weight:600;font-family:var(--sans);width:auto;max-width:none}
.row.stay input[type=date]{width:auto}
.row .switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;padding:0;border-radius:16px;background:var(--card2);position:relative;cursor:pointer;transition:background .2s;flex:none;box-shadow:inset 0 0 0 .5px var(--sep);margin:0}
.row .switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .25s}
.row .switch:checked{background:var(--good)}
.row .switch:checked::after{transform:translateX(20px)}
.seg+.hscroll,.seg+.seg{margin-top:-4px}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media (min-width:700px){h1.lt{font-size:40px}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<header class="bar" id="bar">
  <div class="bar-bg glass"></div>
  <div class="bar-inner">
    <span class="bar-title" id="bar-title">Today</span>
    <button class="round-btn glass" id="log-btn" aria-label="Log weigh-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</header>

<main>
  <section class="view" id="v-today" data-title="Today"></section>
  <section class="view" id="v-food" data-title="Food"></section>
  <section class="view" id="v-train" data-title="Train"></section>
  <section class="view" id="v-progress" data-title="Progress"></section>
  <section class="view" id="v-plan" data-title="Plan"></section>
</main>

<nav class="tabbar glass" id="tabbar" role="tablist" aria-label="Sections">
  <div class="lens" id="lens"></div>
  <button class="tab" role="tab" data-tab="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Today</span></button>
  <button class="tab" role="tab" data-tab="food"><svg viewBox="0 0 24 24"><path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0Z"/><path d="M8.5 8c0-1.6 1.2-2 1.2-3.8M12.5 8c0-1.6 1.2-2 1.2-3.8"/></svg><span>Food</span></button>
  <button class="tab" role="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M7 6.5v11M17 6.5v11M3.8 9.5v5M20.2 9.5v5M7 12h10"/></svg><span>Train</span></button>
  <button class="tab" role="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3.5 19.5h17"/><path d="M4.5 15.5 9 11l3.5 3 7-7.5"/></svg><span>Progress</span></button>
  <button class="tab" role="tab" data-tab="plan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg><span>Plan</span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<form class="sheet glass" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grabber"></div>
  <h3 id="sheet-title">Log weigh-in</h3>
  <p class="note" style="margin-top:4px">Morning, after the toilet, before food or water.</p>
  <div class="fields">
    <label for="l-date">Date<input id="l-date" type="date" required></label>
    <label for="l-weight">Weight (kg)<input id="l-weight" type="number" step="0.1" min="30" max="250" inputmode="decimal" required placeholder="84.6"></label>
    <label for="l-waist">Waist at navel (cm, optional)<input id="l-waist" type="number" step="0.5" min="40" max="200" inputmode="decimal" placeholder="96"></label>
  </div>
  <div class="acts"><button type="button" class="btn glass" id="sheet-cancel">Cancel</button><button type="submit" class="btn">Save</button></div>
</form>
<div class="toast glass" id="toast" hidden role="status"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>Number(n).toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d});
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>new Date(s+"T00:00:00");
const DAY=864e5, BREAKS=[10,22], DELOADS=[10,16,22], KEY="blueprint-v1";

/* ================= state ================= */
const DEFAULTS={sex:"m",age:21,height:175,weight:85,goal:65,activity:"auto",start:"2026-11-01",examples:true};
const DEFAULT_STAYS=()=>[{place:"london",from:"2026-11-01",gym:false},{place:"lagos",from:"2026-12-01",gym:true}];
const UI_DEFAULTS={glass:40,theme:"system",installDismissed:false};
function hydrate(s){
  s=s||{};
  const out={schema:2,settings:{...DEFAULTS,...(s.settings||{})},stays:Array.isArray(s.stays)&&s.stays.length?s.stays:DEFAULT_STAYS(),log:s.log||{},ui:{...UI_DEFAULTS,...(s.ui||{})}};

function calcCore(w,act){
  const s=state.settings,h=+s.height,a=+s.age,g=+s.goal,male=s.sex==="m";
  const bmr=10*w+6.25*h-5*a+(male?5:-161),tdee=bmr*act;
  const reqRate=Math.max(0,(w-g)/24),reqDef=reqRate*7700/7;
  const maxDef=Math.min(.25*tdee,w*.01*7700/7),floor=male?1500:1200;
  let kcal=Math.round((tdee-Math.min(reqDef,maxDef))/50)*50;const floored=kcal<floor;if(floored)kcal=floor;
  const rate=Math.max(0,tdee-kcal)*7/7700;
  const protein=Math.round(2*g/5)*5,fat=Math.round(kcal*.25/9/5)*5,carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4/5)*5);
  return {tdee,kcal,rate,pct:rate/w*100,reqRate,protein,fat,carbs,floored,maint:Math.round(tdee/50)*50,act};
}
function project(startW){ // week by week: weight drops, calories and activity follow your stays
  const g=+state.settings.goal,path=[startW];let w=startW,goalWeek=startW<=g?0:Infinity;
  for(let k=1;k<=80;k++){

    path.push(w);if(w<=g+.05&&goalWeek===Infinity)goalWeek=k;
  }
  return {path,at26:path[26],goalWeek};
}

}

function weekly(){
  const m=new Map();
  for(const e of entries()){const k=weekOf(parse(e.d));if(!m.has(k))m.set(k,{w:[],waist:[]});m.get(k).w.push(e.w);if(e.waist)m.get(k).waist.push(e.waist);}
  return [...m].sort((a,b)=>a[0]-b[0]).map(([k,v])=>({k,avg:v.w.reduce((a,b)=>a+b,0)/v.w.length,waist:v.waist.length?v.waist.reduce((a,b)=>a+b,0)/v.waist.length:null}));
}
function paceOf(prev,cur){
  if(!prev)return['','First week'];
  const pct=-(cur.avg-prev.avg)/prev.avg*100;
  if(BREAKS.includes(cur.k))return['','Diet break'];
  return pct>1.2?['bad','Too fast']:pct>=.4?['good','On pace']:pct>=.15?['warn','Slow']:['warn','Flat'];
}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200);}

function moveCard(now){
  const mv=nextMove(now),cur=stayAt(now),prev=prevStay(cur);
  if(mv){const days=Math.round((parse(mv.from)-parse(iso(now)))/DAY);
    if(days<=7){const r2=calc(parse(mv.from));
      return `<div class="card stack" style="margin-bottom:12px"><div class="meal-h"><b>${PLACES[mv.place].name} ${days===1?"tomorrow":"on "+longDate(parse(mv.from))}</b><span class="pill">${days} day${days===1?"":"s"}</span></div>
      <ul class="rules"><li><b>Travel day:</b> eat around maintenance; don't try to diet in an airport. Pack protein you can carry: tuna pouches, protein bars, nuts.</li>
      <li>Drink water on the flight and walk the terminal. No workout that day.</li>
      <li>After you land, expect the scale to jump 1–2 kg from salt, carbs and travel. It's water. Compare weekly averages from your second week.</li>
      <li>From ${longDate(parse(mv.from))} your target is <b>${fmt(r2.kcal)} kcal</b>${mv.gym?" and training moves to the gym":""}.</li></ul></div>`;}}
  if(prev&&prev.place!==cur.place){const since=Math.round((parse(iso(now))-parse(cur.from))/DAY);
    if(since>=0&&since<7)return `<div class="card" style="margin-bottom:12px"><div class="meal-h"><b>Settling into ${PLACES[cur.place].name}</b><span class="pill">Day ${since+1}</span></div><p class="note" style="margin-top:4px">Ignore the scale this week; travel and new food move water around. Get the shopping done, cook a batch, and get your steps in.</p></div>`;}
  return "";
}

/* ================= PROGRESS ================= */
function chartSVG(){
  const s=state.settings,es=entries(),wk=weekly(),goal=+s.goal,startW=es.length?es[0].w:+s.weight,proj=project(startW);
  const W=340,H=210,L=32,R=8,T=10,B=24,lastWeek=Math.max(26,...wk.map(x=>x.k));
  const vals=[startW,goal,...es.map(e=>e.w)];let lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
  const step=hi-lo>16?4:2;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x=k=>L+k/lastWeek*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g="";
  for(let v=lo;v<=hi;v+=step)g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`;
  for(let k=0;k<=lastWeek;k+=4)g+=`<text class="ax" x="${x(k)}" y="${H-8}" text-anchor="middle">${k?"W"+k:"0"}</text>`;
  // shade stays by place
  const st=parse(s.start).getTime();
  state.stays.forEach((sy,i)=>{const a=Math.max(0,(parse(sy.from).getTime()-st)/DAY/7),nx=state.stays[i+1],b=nx?Math.min(lastWeek,(parse(nx.from).getTime()-st)/DAY/7):lastWeek;
    if(b>a&&a<lastWeek)g+=`<rect x="${x(a).toFixed(1)}" y="${T}" width="${(x(b)-x(a)).toFixed(1)}" height="${H-T-B}" fill="${sy.place==="london"?"var(--p-blue)":"var(--p-green)"}" opacity=".06"/><text class="ax" x="${(x(a)+3).toFixed(1)}" y="${T+10}">${PLACES[sy.place].name}</text>`;});
  g+=`<line class="goal" x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}"/>`;
  let d="";for(let k=0;k<=lastWeek;k++)d+=(k?"L":"M")+x(k).toFixed(1)+" "+y(proj.path[Math.min(k,80)]).toFixed(1);
  g+=`<path class="target" d="${d}"/>`;
  for(const e of es){const k=(parse(e.d).getTime()-st)/DAY/7;if(k>=0&&k<=lastWeek)g+=`<circle class="dot" cx="${x(k).toFixed(1)}" cy="${y(e.w).toFixed(1)}" r="2.5"/>`;}
  const pts=wk.filter(p=>p.k>=1).map(p=>[x(p.k-.5),y(p.avg)]);
  if(pts.length>1)g+=`<path class="avg" d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("")}"/>`;
  pts.forEach((p,i)=>g+=`<circle class="avgdot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4.5:3}"/>`);
  if(!es.length)g+=`<text class="empty" x="${(L+W-R)/2}" y="${T+40}" text-anchor="middle">Your weigh-ins will plot here.</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend against target path">${g}</svg>`;
}

  $("#v-progress").innerHTML=`

    <div class="tiles">
      <div class="tile"><span>Latest avg</span><b>${last?fmt(last.avg,1):"–"}</b><span>kg</span></div>

    </div>
    <div class="card" style="margin-top:12px">${chartSVG()}
      <div class="legend"><span><i style="background:var(--accent)"></i>Weekly average</span><span><i style="background:var(--accent);opacity:.3"></i>Daily</span><span><i style="background:var(--muted)"></i>Target path</span><span><i style="background:var(--p-green)"></i>Goal ${fmt(+s.goal,1)}</span></div>
      <button class="btn block" style="margin-top:14px" data-act="log">Log weigh-in</button>
    </div>
    <h2 class="sh">Weekly averages</h2>
    <div class="list">${wk.length?wk.slice().reverse().map((x,i,a)=>{const pv=a[i+1],[c,t]=paceOf(pv,x),ch=pv?x.avg-pv.avg:null;return `<div class="row"><div class="l"><b>Week ${x.k}</b><small>${ch==null?"":(ch>0?"+":"")+fmt(ch,2)+" kg"}${x.waist?` · waist ${fmt(x.waist,1)} cm`:""}</small></div><span class="r num" style="color:var(--ink)">${fmt(x.avg,1)}</span><span class="pill ${c}">${t}</span></div>`}).join(""):`<div class="row"><span class="muted">Appears after your first weigh-in.</span></div>`}</div>
    <h2 class="sh">Recent weigh-ins</h2>
    <div class="list">${es.length?es.slice(-14).reverse().map(e=>`<div class="row"><div class="l">${longDate(parse(e.d))}${e.waist?`<small>Waist ${fmt(e.waist,1)} cm</small>`:""}</div><span class="r num" style="color:var(--ink)">${fmt(e.w,1)} kg</span><button class="btn danger" data-del="${e.d}" aria-label="Delete ${e.d}">Delete</button></div>`).join(""):`<div class="row"><span class="muted">No weigh-ins yet.</span></div>`}</div>
    <h2 class="sh">Every 4 weeks</h2>
    <div class="card"><ul class="rules">
      <li>Front, side and back photos in the same light and clothes.</li>
      <li>Update your weight in Plan. Your calories drop slightly as you get lighter.</li>
      <li>Compare main lifts with 4 weeks ago. Flat or up is a win.</li>
      <li>Check the Adjustments list in Plan before changing anything.</li>
    </ul></div>`;
}

/* ================= PLAN ================= */
function renderPlan(){
  const r=calc(),s=state.settings,now=weekOf(new Date());
  const flags=[];
  if(+s.goal>=+s.weight)flags.push(["bad","Your goal weight isn't below your current weight."]);
  flags.push(["warn",`<b>The old plan's 1,400–1,500 kcal</b> is ≈${fmt(r.tdee-1450)} kcal under your maintenance: ≈${fmt(r.oldRate,2)} kg a week (${fmt(r.oldPct,1)}% of body weight). Past 1% a week you lose more muscle. This plan caps the deficit there.`]);
  if(r.at26>+s.goal+.05)flags.push(["warn",`${s.goal} kg in 26 weeks needs ${fmt(r.reqRate,2)} kg a week. At a safe pace you'll be ≈<b>${fmt(r.at26,1)} kg at week 26</b> and reach the goal near week ${isFinite(r.weeksToGoal)?r.weeksToGoal:"–"}.`]);
  else if(+s.goal<+s.weight)flags.push(["good",`Your goal fits in 26 weeks at a safe pace.`]);
  if(r.floored)flags.push(["warn","Your target hit the minimum floor. Get more of the deficit from steps."]);
  flags.push(r.bmiGoal<18.5?["bad",`${s.goal} kg is a BMI of ${fmt(r.bmiGoal,1)} at your height: underweight. Pick a higher goal.`]:["good",`Goal BMI ${fmt(r.bmiGoal,1)} (now ${fmt(r.bmiNow,1)}). Since you're building muscle, judge the finish by waist and mirror too.`]);
  const pk=r.protein*4,fk=r.fat*9,ck=r.carbs*4,tot=pk+fk+ck||1;
  const row=(id,label,input)=>`<label class="row" for="${id}"><span class="l">${label}</span>${input}</label>`;
  const adjust=[["Losing 0.5–1% of body weight a week, lifts steady.","Change nothing."],[`Losing under ${fmt(+s.weight*.0025,2)} kg a week for 2+ weeks, logging honestly.`,"Check oil, drinks and weekends first. Then cut 100–150 kcal (half a fist of starch) or add 2,000 steps. One change only."],["Scale flat, waist down, lifts up.","Fat loss is hidden by water and muscle. Wait one more week."],[`Losing over ${fmt(+s.weight*.012,2)} kg a week, strength dropping, always hungry.`,"Add 150–200 kcal of carbs around training."],["Lifts drop two sessions running, joints ache, poor sleep.","Take the next deload now. Check sleep and protein."],["Stalled 3+ weeks in weeks 13–20.",`7-day diet break at maintenance, ≈${fmt(r.maint)} kcal for you now. Then resume.`],["Just moved country.","Ignore the scale for a week. Log food carefully for that week; new food means new portions."],["Missed sessions or a heavy weekend.","Don't starve or add punishment cardio. Restart at the next meal and session."],["Exams or illness.","Drop to 3 sessions or just walk. Keep protein high. Maintenance calories while ill."]];
  const stayKcal=sy=>{const d=parse(sy.from)<parse(s.start)?parse(s.start):parse(sy.from);const c=calc(d);return `${fmt(c.kcal)} kcal at the start (${ACT_LABEL[c.act]||"custom"} activity)`;};

  $("#v-plan").innerHTML=`
    <h1 class="lt">Plan</h1><p class="sub">${fmt(+s.weight,1)} kg → ${fmt(+s.goal,1)} kg · from ${parse(s.start).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</p>
    <div class="tiles">
      <div class="tile"><span>Calories now</span><b>${fmt(r.kcal)}</b><span>maint. ≈${fmt(r.maint)}</span></div>
      <div class="tile"><span>Loss / week</span><b>${fmt(r.rate,2)}</b><span>kg · ${fmt(r.pct,1)}%</span></div>
      <div class="tile"><span>Week 26</span><b>${fmt(r.at26,1)}</b><span>${r.at26<=+s.goal+.05?"goal reached":"goal ≈ wk "+(isFinite(r.weeksToGoal)?r.weeksToGoal:"–")}</span></div>
    </div>

    <h2 class="sh">Where you'll be</h2>
    <div class="list">
      ${state.stays.map((sy,i)=>`<div class="row stay">
        <div class="stay-top"><span style="display:flex;align-items:center;gap:6px;color:var(--accent)">${ICON_PIN}<select id="stay-place-${i}" data-stay="${i}" data-field="place" aria-label="Place">${Object.entries(PLACES).map(([k,v])=>`<option value="${k}" ${k===sy.place?"selected":""}>${v.name}</option>`).join("")}</select></span>
          <input id="stay-from-${i}" type="date" value="${sy.from}" data-stay="${i}" data-field="from" aria-label="From date"></div>
        <div class="stay-top"><label for="stay-gym-${i}" style="display:flex;align-items:center;gap:10px;font-size:15px"><input id="stay-gym-${i}" class="switch" type="checkbox" ${sy.gym?"checked":""} data-stay="${i}" data-field="gym">Gym access</label>
          ${state.stays.length>1?`<button class="btn danger" data-stay-del="${i}">Remove</button>`:""}</div>
        <small>From ${longDate(parse(sy.from))}${state.stays[i+1]?` to ${longDate(new Date(parse(state.stays[i+1].from).getTime()-DAY))}`:" onwards"} · ${stayKcal(sy)}</small>
      </div>`).join("")}
      <button class="row" data-act="add-stay" style="width:100%;border:0;background:none;text-align:left;color:var(--accent)">Add a stay</button>
    </div>
    <p class="note" style="margin:8px 4px 0">Each stay lasts until the next one starts. Meals, activity tips, gym or no-gym sessions and calories follow where you are on each date.</p>

    <h2 class="sh">Your details</h2>
    <div class="list">
      ${row("f-sex","Sex",`<select id="f-sex"><option value="m">Male</option><option value="f">Female</option></select>`)}
      ${row("f-age","Age",`<input id="f-age" type="number" inputmode="numeric" min="15" max="80">`)}
      ${row("f-height","Height (cm)",`<input id="f-height" type="number" inputmode="decimal" min="130" max="220">`)}
      ${row("f-weight","Current weight (kg)",`<input id="f-weight" type="number" step="0.1" inputmode="decimal">`)}
      ${row("f-goal","Goal weight (kg)",`<input id="f-goal" type="number" step="0.1" inputmode="decimal">`)}
      ${row("f-activity","Activity",`<select id="f-activity"><option value="auto">Auto</option><option value="1.375">Light</option><option value="1.55">Moderate</option><option value="1.725">High</option></select>`)}
      ${row("f-start","Start date",`<input id="f-start" type="date">`)}
    </div>
    <p class="note" style="margin:8px 4px 0">${s.examples?"<b>Age and height are examples (21, 175 cm).</b> Enter yours. ":""}Auto uses light activity for home training or no gym, and moderate for 4 gym days with ~10k steps. Update your weight every 4 weeks.</p>

    <h2 class="sh">Macros now</h2>
    <div class="card stack">
      <div class="meter" style="height:12px;display:flex;background:none;gap:2px"><span style="width:${pk/tot*100}%;background:var(--p-red)"></span><span style="width:${ck/tot*100}%;background:var(--p-yellow)"></span><span style="width:${fk/tot*100}%;background:var(--p-blue)"></span></div>
      <div class="tiles">
        <div class="tile" style="background:var(--card2)"><span>Protein</span><b>${r.protein} g</b><span>2 g/kg goal</span></div>
        <div class="tile" style="background:var(--card2)"><span>Carbs</span><b>${r.carbs} g</b><span>around training</span></div>
        <div class="tile" style="background:var(--card2)"><span>Fat</span><b>${r.fat} g</b><span>incl. oil</span></div>
      </div>
    </div>

    <h2 class="sh">Reality check</h2>
    <div class="card stack">${flags.map(([c,t])=>`<div class="flag ${c}"><p>${t}</p></div>`).join("")}</div>

    <h2 class="sh">Timeline</h2>
    <div class="card">
      <div class="weeks">${Array.from({length:30},(_,i)=>{const w=i+1,p=phaseOf(w),pl=stayAt(weekStart(w)).place;return `<div class="wk ${p?"":"after"} ${DELOADS.includes(w)?"deload":""} ${w===now?"now":""}" style="${p?`background-color:${p.color}`:""}" title="Week ${w} · ${PLACES[pl].name}">${BREAKS.includes(w)?"DB":w}</div>`}).join("")}</div>
      <p class="note" style="margin-top:10px">Striped = deload. DB = diet break at maintenance. Outlined = this week. Weeks 27–30: reverse to maintenance.</p>
    </div>
    <div style="margin-top:12px">${PHASES.map(p=>`<details class="phase" ${now>=p.weeks[0]&&now<=p.weeks[1]?"open":""}><summary><span class="bar5" style="background:${p.color}"></span><span style="flex:1"><b>${p.name}</b><br><span class="note">Weeks ${p.weeks[0]}–${p.weeks[1]} · ${[...new Set(Array.from({length:p.weeks[1]-p.weeks[0]+1},(_,j)=>PLACES[stayAt(weekStart(p.weeks[0]+j)).place].name))].join(", then ")}</span></span>${now>=p.weeks[0]&&now<=p.weeks[1]?'<span class="pill good">Now</span>':""}</summary>
      <dl><dt>Training</dt><dd>${p.train}</dd><dt>Food</dt><dd>${p.food}</dd><dt>Steps</dt><dd>${p.steps}</dd><dt>Checkpoint</dt><dd>${p.check}</dd></dl></details>`).join("")}</div>

    <h2 class="sh">Adjustments</h2>
    <div class="list">${adjust.map(([a,b])=>`<div class="row"><div class="l"><b style="font-weight:600">${a}</b><small>${b}</small></div></div>`).join("")}</div>

    <h2 class="sh">Recovery</h2>
    <div class="list">${[["Sleep","7–9 hours. Short sleep raises hunger and costs muscle. Fixed wake time, screens off 30 minutes before bed."],["Water in London",PLACE_INFO.london.water],["Water in Lagos",PLACE_INFO.lagos.water],["Vitamin D in the UK","The NHS advises everyone in the UK to consider 10 micrograms of vitamin D a day from October to March, when there isn't enough sunlight. Supermarkets sell it cheaply."],["Supplements","Optional. Creatine 3–5 g daily for strength; expect 1–2 kg of water weight at first. Whey is just convenient protein. Skip fat burners."],["Busy weeks","Plan on Sunday: training slots, shopping list, batch cooking. In exam weeks drop to 3 sessions and keep protein and steps."],["Slow down if","You feel dizzy or faint, can't sleep, lose strength for 3+ weeks, or start bingeing. Eat at maintenance for a week; see a doctor if it continues."],["After week 26","Add 100–150 kcal a week until maintenance. Then keep cutting to finish, or start a lean-gain phase (+200–300 kcal) to build muscle."]].map(([a,b])=>`<div class="row"><div class="l"><b style="font-weight:600">${a}</b><small>${b}</small></div></div>`).join("")}</div>

    <h2 class="sh">Appearance</h2>
    <div class="list">
      <div class="row" style="display:grid;gap:6px"><span>Glass</span><input id="glass-slider" type="range" min="0" max="100" value="${state.ui.glass}" aria-label="Glass transparency"><span class="note" style="display:flex;justify-content:space-between"><span>Clear</span><span>Tinted</span></span></div>
      ${row("theme-sel","Theme",`<select id="theme-sel"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>`)}
    </div>

    <h2 class="sh">Your data</h2>
    <div class="list">
      <button class="row" data-act="export" style="width:100%;border:0;background:none;text-align:left;color:var(--accent)">Export backup</button>
      <button class="row" data-act="import" style="width:100%;border:0;background:none;text-align:left;color:var(--accent)">Import backup</button>
      <button class="row" data-act="reset" id="reset-btn" style="width:100%;border:0;background:none;text-align:left;color:var(--bad)">Erase all data</button>
    </div>
    <p class="note" style="margin:8px 4px 0">Everything stays on this phone. Export a backup now and then, and before changing phones.</p>
    <p class="note" style="margin:22px 4px 0">Calories use the Mifflin-St Jeor equation (±10% for most people); your real 3–4 week trend is the better guide. General guidance, not medical advice.</p>`;

  for(const f of ["sex","age","height","weight","goal","activity","start"]){const el=$("#f-"+f);el.value=String(s[f]);
    el.addEventListener("change",()=>{const v=el.value;if(v==="")return;s[f]=(f==="sex"||f==="start"||v==="auto")?v:+v;if(f==="age"||f==="height")s.examples=false;save();renderPlan();toast("Plan updated");});}
  document.querySelectorAll("#v-plan [data-stay]").forEach(el=>el.addEventListener("change",()=>{
    const sy=state.stays[+el.dataset.stay],f=el.dataset.field;
    if(f==="gym")sy.gym=el.checked;else if(f==="place"){sy.place=el.value;}else{if(!el.value)return;sy.from=el.value;}
    state.stays.sort((a,b)=>a.from<b.from?-1:1);save();foodPlace=null;trainGym=null;renderPlan();toast("Stays updated");
  }));
  $("#theme-sel").value=state.ui.theme;
  $("#theme-sel").addEventListener("change",e=>{state.ui.theme=e.target.value;applyUI();save();});
  $("#glass-slider").addEventListener("input",e=>{state.ui.glass=+e.target.value;applyUI();});
  $("#glass-slider").addEventListener("change",save);
}
function addStay(){
  const last=state.stays[state.stays.length-1],d=parse(last.from>iso(new Date())?last.from:iso(new Date()));d.setDate(d.getDate()+30);
  const place=last.place==="lagos"?"london":"lagos";
  state.stays.push({place,from:iso(d),gym:place==="lagos"});save();renderPlan();toast("Stay added. Set its date.");
}

/* ================= shell ================= */
const TABS=["today","food","train","progress","plan"];
const RENDER={today:renderToday,food:renderFood,train:renderTrain,progress:renderProgress,plan:renderPlan};
const scrollPos={};let current=null;
function applyUI(){
  const root=document.documentElement;
  if(state.ui.theme==="system")root.removeAttribute("data-theme");else root.setAttribute("data-theme",state.ui.theme);
  const t=state.ui.glass/100, dark=state.ui.theme==="dark"||(state.ui.theme==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);
  root.style.setProperty("--glass-a",(dark?.22+t*.62:.14+t*.72).toFixed(3));
}
function go(tab,{push=true}={}){
  if(!TABS.includes(tab))tab="today";
  if(current)scrollPos[current]=window.scrollY;
  current=tab;
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+tab));
  document.querySelectorAll(".tab").forEach((b,i)=>{const on=b.dataset.tab===tab;b.setAttribute("aria-selected",on);if(on)$("#lens").style.transform=`translateX(${i*100}%)`;});
  $("#bar-title").textContent=$("#v-"+tab).dataset.title;
  RENDER[tab]();
  window.scrollTo(0,scrollPos[tab]||0);onScroll();
  // Previews (about:srcdoc iframes) refuse history changes; the app still works without the hash.
  if(push&&location.hash!=="#"+tab){try{history.replaceState(null,"","#"+tab);}catch(e){}}
}
function rerender(){RENDER[current]();}
function onScroll(){const y=window.scrollY;$("#bar").classList.toggle("scrolled",y>6);$("#bar").classList.toggle("titled",y>40);}
addEventListener("scroll",onScroll,{passive:true});
addEventListener("hashchange",()=>go(location.hash.slice(1),{push:false}));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyUI);

$("#tabbar").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;if(b.dataset.tab===current)window.scrollTo({top:0,behavior:"smooth"});else go(b.dataset.tab);});

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-act],[data-day],[data-place],[data-mode],[data-session],[data-gymmode],[data-del],[data-stay-del]");if(!t)return;
  if(t.dataset.go){if(t.dataset.go==="food"){foodDay=todayIdx();foodPlace=null;}if(t.dataset.go==="train"){trainMode=null;trainSession=null;trainGym=null;}go(t.dataset.go);}
  else if(t.dataset.place){foodPlace=t.dataset.place;renderFood();}
  else if(t.dataset.gymmode){trainGym=t.dataset.gymmode==="1";renderTrain();}
  else if(t.dataset.stayDel){state.stays.splice(+t.dataset.stayDel,1);save();foodPlace=null;trainGym=null;renderPlan();toast("Stay removed");}
  else if(t.dataset.day){foodDay=+t.dataset.day;renderFood();}
  else if(t.dataset.mode){trainMode=t.dataset.mode;renderTrain();}
  else if(t.dataset.session){trainSession=t.dataset.session;renderTrain();}
  else if(t.dataset.del){delete state.log[t.dataset.del];save();rerender();toast("Weigh-in deleted");}
  else{const a=t.dataset.act;
    if(a==="log")openSheet();
    if(a==="add-stay")addStay();
    if(a==="dismiss-install"){state.ui.installDismissed=true;save();renderToday();}
    if(a==="export")exportData();
    if(a==="import")$("#import-file").click();
    if(a==="reset"){if(t.dataset.armed){localStorage.removeItem(KEY);state=hydrate(null);applyUI();save();rerender();toast("All data erased");}
      else{t.dataset.armed="1";t.textContent="Tap again to erase everything";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent="Erase all data";}},4000);}}
  }
});

/* sheet */
function openSheet(){$("#l-date").value=iso(new Date());$("#l-weight").value="";$("#l-waist").value="";$("#scrim").hidden=false;$("#sheet").hidden=false;setTimeout(()=>$("#l-weight").focus(),350);}
function closeSheet(){$("#scrim").hidden=true;$("#sheet").hidden=true;}
$("#log-btn").addEventListener("click",openSheet);
$("#scrim").addEventListener("click",closeSheet);
$("#sheet-cancel").addEventListener("click",closeSheet);
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
$("#sheet").addEventListener("submit",e=>{
  e.preventDefault();
  const d=$("#l-date").value,w=parseFloat($("#l-weight").value),waist=parseFloat($("#l-waist").value);
  if(!d||!(w>30&&w<300)){toast("Enter a weight in kg");return;}
  state.log[d]={w,...(waist>0?{waist}:{})};save();closeSheet();rerender();toast(`Logged ${fmt(w,1)} kg`);
});

/* backup */
async function exportData(){
  const name=`blueprint-backup-${iso(new Date())}.json`,text=JSON.stringify(state,null,2);
  try{const file=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Blueprint backup"});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$("#import-file").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||typeof d.log!=="object"||typeof d.settings!=="object")throw 0;
    state=hydrate(d);save();foodPlace=null;trainGym=null;applyUI();rerender();toast(`Imported ${Object.keys(d.log).length} weigh-ins`);}
  catch(_){toast("That file isn't a Blueprint backup");}
});

/* boot */
applyUI();
go(location.hash.slice(1)||"today",{push:true});
let lastDay=iso(new Date());
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&iso(new Date())!==lastDay){lastDay=iso(new Date());foodDay=todayIdx();foodPlace=null;trainGym=null;rerender();}});
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
